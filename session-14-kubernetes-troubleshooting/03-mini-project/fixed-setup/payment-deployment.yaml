apiVersion: v1
kind: Secret
metadata:
  name: payment-db-secret
  namespace: default
type: Opaque
stringData:
  password: "SuperSecurePaymentDBPassword2026!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
    spec:
      containers:
        - name: payment-api
          image: nginx:alpine
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: password
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
